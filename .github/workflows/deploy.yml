name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish; queue at most one newer run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only export VITE_FORMSPREE_ID when the secret is set. An empty value
      # would be inlined as "" and bypass the hardcoded fallback in the app.
      - name: Build
        env:
          FORMSPREE_SECRET: ${{ secrets.VITE_FORMSPREE_ID }}
        run: |
          if [ -n "$FORMSPREE_SECRET" ]; then
            export VITE_FORMSPREE_ID="$FORMSPREE_SECRET"
          fi
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
