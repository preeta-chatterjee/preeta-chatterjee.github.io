<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: self-hosted (public/fonts, SIL OFL), latin subset. The four faces used in the
         first screen are preloaded so they arrive with the app bundle and the first render is
         already in the right font (no fallback-font flash, no jump). See "Loading rules" in CLAUDE.md. -->
    <link rel="preload" href="/fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-serif-display-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* block: first-screen faces wait for the preloaded file (browser caps the wait at ~3s)
         instead of showing a fallback and jumping; swap: faces used only below the fold. */
      @font-face { font-family: "Bebas Neue"; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/bebas-neue-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "DM Mono"; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/dm-mono-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "DM Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/dm-mono-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/dm-sans-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "DM Serif Display"; font-style: italic; font-weight: 400; font-display: block; src: url(/fonts/dm-serif-display-latin-400-italic.woff2) format("woff2"); }
      @font-face { font-family: "DM Serif Display"; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/dm-serif-display-latin-400-normal.woff2) format("woff2"); }
      /* Page color before the app renders, so the first frames aren't white */
      html, body { background: #F2F2F2; }
    </style>
    <title>Preeta Chatterjee | Computer Vision · Simulation · Game Engines</title>
    <meta name="description" content="MS CS @ Northeastern · Computer vision, simulation, and game engines. Seeking a co-op/internship, January–August 2027." />

    <!-- Open Graph (LinkedIn, Slack, Discord, iMessage previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://preeta-chatterjee.github.io" />
    <meta property="og:title"       content="Preeta Chatterjee | Computer Vision · Simulation · Game Engines" />
    <meta property="og:description" content="MS CS @ Northeastern · Computer vision, simulation, and game engines. Seeking a co-op/internship, January–August 2027." />
    <meta property="og:image"       content="https://preeta-chatterjee.github.io/og-preview.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Preeta Chatterjee | Computer Vision · Simulation · Game Engines" />
    <meta name="twitter:description" content="MS CS @ Northeastern · Computer vision, simulation, and game engines. Seeking a co-op/internship, January–August 2027." />
    <meta name="twitter:image"       content="https://preeta-chatterjee.github.io/og-preview.png" />
  </head>
