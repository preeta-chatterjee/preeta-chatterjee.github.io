<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Bebas Neue';src:url(/__fonts/bebas-neue/files/bebas-neue-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'DM Mono';font-weight:500;src:url(/__fonts/dm-mono/files/dm-mono-latin-500-normal.woff2) format('woff2');}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#F2F2F2;position:relative;font-family:'DM Mono',monospace}
.grid{position:absolute;top:0;right:0;width:390px;height:630px;border-left:1px solid #e8e8e8;
  background-image:radial-gradient(circle,#d0d0d0 1.4px,transparent 1.4px);background-size:26px 26px}
.c{position:absolute;border-radius:50%}
.wrap{position:absolute;left:80px;top:0;height:630px;display:flex;flex-direction:column;justify-content:center}
.rule{width:56px;height:3px;background:linear-gradient(to right,#174D38,#4D1717);margin-bottom:30px}
.name{font-family:'Bebas Neue',sans-serif;font-size:156px;line-height:.9;letter-spacing:.02em}
.name .a{color:#111}.name .b{color:#4D1717}
.chips{display:flex;gap:12px;margin-top:40px}
.chip{font-family:'DM Mono',monospace;font-weight:500;font-size:19px;letter-spacing:.12em;text-transform:uppercase;padding:10px 18px;border:2px solid}
.g{background:#174D38;border-color:#174D38;color:#F2F2F2}.r{background:#4D1717;border-color:#4D1717;color:#F2F2F2}.o{border-color:#bdbdbd;color:#444}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(to right,#174D38,#4D1717)}
</style></head><body>
<div class="grid"></div>
<div class="c" style="right:250px;top:120px;width:64px;height:64px;background:#174D38;opacity:.55"></div>
<div class="c" style="right:120px;top:210px;width:96px;height:96px;background:#4D1717;opacity:.35"></div>
<div class="c" style="right:200px;top:380px;width:44px;height:44px;border:2.5px solid #2d7a57;opacity:.7"></div>
<div class="c" style="right:80px;top:440px;width:30px;height:30px;background:#8b3a3a;opacity:.5"></div>
<div class="c" style="right:300px;top:470px;width:22px;height:22px;background:#1e6347;opacity:.45"></div>
<div class="wrap">
  <div class="rule"></div>
  <div class="name"><div class="a">PREETA</div><div class="b">CHATTERJEE</div></div>
  <div class="chips"><span class="chip g">Computer Vision</span><span class="chip r">Simulation</span><span class="chip o">Game Engines</span></div>
</div>
<div class="bar"></div>
</body></html>
